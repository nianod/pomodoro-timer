<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="click" value="click me">click me</button>
    <script>
        const click = document.getElementById("click");
        click.addEventListener('click', function(){
            let clicked = prompt("Button clicked! Type yes to proceed");
            if(clicked && clicked.toLowerCase() === "yes") {
                alert("so do we proceed?"); 
            } else {
                alert("You're just begger trying my mind");
            }
        });
    </script>
</body>
</html>
